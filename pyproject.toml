# Tool settings only. The project runs from a checkout (`python -m scripts.x`
# or `python scripts/x.py`); nothing here is packaged or installed.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's default set: pycodestyle errors and pyflakes. That is the part that
# catches real defects (undefined names, unused imports) rather than style.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    # Tests for code the author writes by hand: the scorer, the schema
    # validation and the QLoRA configuration. conftest.py reports them as
    # skipped while the function under test still raises NotImplementedError,
    # and they run for real as soon as it is written.
    "core: test of a hand-written core module",
]
